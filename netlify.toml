# Blog publicado como um site separado no Netlify.
# O portfólio (joaoa.com.br) faz proxy de /blog/* para este site.
[build]
  command = "npm run build"
  publish = "dist"

# Quem abrir o endereço .netlify.app direto cai no blog
[[redirects]]
  from = "/"
  to = "/blog/"
  status = 301

# Arquivos gerados pelo Astro têm hash no nome: podem ficar em cache por um ano
[[headers]]
  for = "/blog/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
